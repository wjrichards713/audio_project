[package]
name = "audio-sfu"
version = "0.1.0"
edition = "2021"
description = "Real-time audio SFU server — proof of concept"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
bytes = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
